name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formula:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install and test the formula
        run: |
          if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"; fi
          brew tap sagol/tap "$GITHUB_WORKSPACE"
          brew install --build-from-source sagol/tap/mdbindery
          brew test sagol/tap/mdbindery
          brew audit --strict --formula sagol/tap/mdbindery
          mdbindery install-tools --no-node
          mdbindery doctor
